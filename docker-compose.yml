services:
  backend:
    build: .
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379/0
      - CORS_ORIGINS=http://localhost:5173
      - LOCAL_DESKTOP_MODE=true
      - WEB_SAFE_MODE=false
      - RATE_LIMIT_COOLDOWN=1.0
      - REQUIRE_API_KEY=${REQUIRE_API_KEY:-false}
      - PROTECT_METRICS=${PROTECT_METRICS:-false}
      - MEERO_API_KEY=${MEERO_API_KEY:-}
      - APP_LAUNCH_ALLOWLIST=${APP_LAUNCH_ALLOWLIST:-}
      - APP_CLOSE_ALLOWLIST=${APP_CLOSE_ALLOWLIST:-}
      - APP_FORCE_CLOSE_ALLOWLIST=${APP_FORCE_CLOSE_ALLOWLIST:-}
      - AUDIT_LOG_COMMAND_TEXT=${AUDIT_LOG_COMMAND_TEXT:-false}
    depends_on:
      - redis

  frontend:
    build: ./frontend
    env_file:
      - path: ./frontend/.env
        required: false
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    environment:
      - CHOKIDAR_USEPOLLING=true

  redis:
    image: redis:7-alpine
    ports:
      # Exposed for local debugging only; production compose keeps Redis internal.
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

volumes:
  redis-data:
