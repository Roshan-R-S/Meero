services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.websafe
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models:ro
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379/0
      - CORS_ORIGINS=https://your-domain.com
      - LOCAL_DESKTOP_MODE=false
      - WEB_SAFE_MODE=true
      - RATE_LIMIT_COOLDOWN=1.0
      - REQUIRE_API_KEY=true
      - PROTECT_METRICS=true
      - MEERO_API_KEY=${MEERO_API_KEY}
      - AUDIT_LOG_COMMAND_TEXT=false
      - VOICE_TTS_TIMEOUT_SECONDS=${VOICE_TTS_TIMEOUT_SECONDS:-10}
      - DESKTOP_SUBPROCESS_TIMEOUT_SECONDS=${DESKTOP_SUBPROCESS_TIMEOUT_SECONDS:-5}
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:-https://your-domain.com}
        VITE_MEERO_API_KEY: ${VITE_MEERO_API_KEY:-}
    ports:
      - "80:80"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

volumes:
  redis-data:
