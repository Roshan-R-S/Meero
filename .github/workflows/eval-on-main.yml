name: Evaluation on main

on:
  push:
    branches: [ main ]

jobs:
  train-and-evaluate:
    runs-on: ubuntu-latest
    env:
      MODEL_MIN_ACCURACY: ${{ vars.MODEL_MIN_ACCURACY || '0.85' }}
      MODEL_EPOCHS: ${{ vars.MODEL_EPOCHS || '100' }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install full deps (heavy)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Train model deterministically
        env:
          TF_DETERMINISTIC: '1'
          TRAIN_SEED: '42'
        run: |
          python scripts/train_and_package.py \
            --epochs "$MODEL_EPOCHS" \
            --batch 4 \
            --seed 42 \
            --out-dir models \
            --version main-${{ github.run_number }}
      - name: Run evaluation and write report
        run: |
            python scripts/evaluate.py --out models/main_eval.json --min-accuracy "$MODEL_MIN_ACCURACY"
      - name: Validate evaluation report
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          rep=json.load(open('models/main_eval.json'))
          acc=rep.get('accuracy',0)
          min_acc=float(os.environ.get("MODEL_MIN_ACCURACY", "0.85"))
          print('Main evaluation accuracy=',acc)
          if not (0 <= acc <= 1):
              print(f"Invalid accuracy value: {acc}")
              sys.exit(2)
          if acc < min_acc:
              print(f"Accuracy too low: {acc} < {min_acc}")
              sys.exit(2)
          if rep.get('samples', 0) <= 0:
              print("Evaluation report has no samples")
              sys.exit(2)
          PY
      - name: Run unseen cases evaluation
        run: |
          python scripts/evaluate_routes.py --eval-cases data/intent_eval_cases.json --out models/unseen_eval.json --min-accuracy 0.50 --min-intent-accuracy 0.30
      - name: Run voice cases evaluation
        run: |
          python scripts/evaluate_routes.py --eval-cases data/voice_eval_cases.json --out models/voice_eval.json --min-accuracy 0.50 --min-intent-accuracy 0.30
      - name: Upload evaluation artifact
        uses: actions/upload-artifact@v4
        with:
          name: main-eval-report
          path: models/*_eval.json
