name: Evaluation on main

on:
  push:
    branches: [ main ]

jobs:
  train-and-evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install full deps (heavy)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Train model deterministically
        env:
          TF_DETERMINISTIC: '1'
          TRAIN_SEED: '42'
        run: |
          python scripts/train_and_package.py --epochs 5 --batch 8 --seed 42 --out-dir models --version main-${{ github.run_number }}
      - name: Run evaluation and write report
        run: |
          python scripts/evaluate.py --out models/main_eval.json
      - name: Fail on regression vs baseline
        run: |
          python - <<'PY'
import json,sys,os
base=json.load(open('models/baseline_eval.json'))
rep=json.load(open('models/main_eval.json'))
acc=rep.get('accuracy',0)
print('Main evaluation accuracy=',acc)
if acc < base.get('accuracy',0):
    print(f"Accuracy {acc} below baseline {base.get('accuracy')}")
    sys.exit(2)
PY
      - name: Upload evaluation artifact
        uses: actions/upload-artifact@v4
        with:
          name: main-eval-report
          path: models/main_eval.json
