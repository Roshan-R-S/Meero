name: Provider Adapters Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  provider-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest httpx
      - name: Run provider adapter tests
        run: |
          pytest -q tests/test_providers_openai_compat.py tests/test_providers_openrouter.py tests/test_providers_huggingface.py
