name: Release Publish Artifacts

on:
  release:
    types: [published]

permissions:
  contents: write
  issues: write

jobs:
  publish-on-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system audio headers
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build model package
        env:
          MODEL_EPOCHS: ${{ vars.MODEL_EPOCHS }}
          MODEL_BATCH: ${{ vars.MODEL_BATCH }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python scripts/train_and_package.py \
            --epochs "${MODEL_EPOCHS:-100}" \
            --batch "${MODEL_BATCH:-32}" \
            --version "$RELEASE_TAG" \
            --out-dir build/model-artifacts

      - name: Package GGUF artifacts
        if: ${{ vars.GGUF_INPUT != '' }}
        env:
          GGUF_INPUT: ${{ vars.GGUF_INPUT }}
          LLAMA_CPP_DIR: ${{ vars.LLAMA_CPP_DIR }}
          LLAMA_CPP_CONVERT: ${{ vars.LLAMA_CPP_CONVERT }}
          LLAMA_CPP_QUANTIZE: ${{ vars.LLAMA_CPP_QUANTIZE }}
        run: |
          python scripts/package_gguf.py \
            --input "$GGUF_INPUT" \
            --out-dir build/model-artifacts/gguf \
            --model-name meero-llm

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: meero-model-artifacts-${{ github.event.release.tag_name }}
          path: build/model-artifacts/**

      - name: Attach artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: build/model-artifacts/**

      - name: Require Hugging Face credentials and publish
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: ${{ secrets.HF_REPO }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_REPO" ]; then
            echo "HF_TOKEN and HF_REPO must be configured for release publish; aborting."; exit 1
          fi
          python scripts/publish_artifacts.py --artifact-dir build/model-artifacts

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const tag = context.payload.release.tag_name || 'unknown';
            await github.rest.issues.create({
              owner,
              repo,
              title: `Model artifact publish failed for ${tag}`,
              body: `The release artifact workflow failed for **${tag}**.\n\nRun: ${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
              labels: ['ci-failure']
            });
