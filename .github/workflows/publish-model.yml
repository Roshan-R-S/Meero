name: Publish Model Artifacts

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-package-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system audio headers
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build model package
        env:
          MODEL_EPOCHS: ${{ vars.MODEL_EPOCHS }}
          MODEL_BATCH: ${{ vars.MODEL_BATCH }}
        run: |
          python scripts/train_and_package.py \
            --epochs "${MODEL_EPOCHS:-5}" \
            --batch "${MODEL_BATCH:-32}" \
            --version "${GITHUB_REF_NAME}" \
            --out-dir build/model-artifacts

      - name: Package GGUF artifacts
        if: ${{ vars.GGUF_INPUT != '' }}
        env:
          GGUF_INPUT: ${{ vars.GGUF_INPUT }}
          LLAMA_CPP_DIR: ${{ vars.LLAMA_CPP_DIR }}
          LLAMA_CPP_CONVERT: ${{ vars.LLAMA_CPP_CONVERT }}
          LLAMA_CPP_QUANTIZE: ${{ vars.LLAMA_CPP_QUANTIZE }}
        run: |
          python scripts/package_gguf.py \
            --input "$GGUF_INPUT" \
            --out-dir build/model-artifacts/gguf \
            --model-name meero-llm

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: meero-model-artifacts-${{ github.ref_name }}
          path: build/model-artifacts/**

      - name: Attach artifacts to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: build/model-artifacts/**

      - name: Require Hugging Face credentials and publish
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: ${{ secrets.HF_REPO }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_REPO" ]; then
            echo "HF_TOKEN and HF_REPO must be configured for tag publish; aborting."; exit 1
          fi
          python scripts/publish_artifacts.py --artifact-dir build/model-artifacts
