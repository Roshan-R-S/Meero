name: Publish model on tag

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install huggingface-hub

      - name: Run training and upload (smoke)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO:  ${{ secrets.HF_REPO }}
        run: |
          # Use small epochs for CI smoke test to produce artifacts quickly
          python scripts/train_and_package.py --epochs 1 --batch 8 --upload-hf
