name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
      - name: Secret scan
        run: |
          python scripts/secret_scan.py
      - name: Verify imports and runtime wiring
        run: |
          python verify_changes.py
      - name: Run backend tests
        run: |
          python -m pytest -q

  backend-tests-full:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install full test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test-full.txt
      - name: Run full backend tests
        run: |
          python -m pytest -q

  frontend-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20.19.0']
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install frontend deps
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
      - name: Run frontend tests
        working-directory: frontend
        run: |
          VITEST=true pnpm exec vitest run
      - name: Run frontend lint
        working-directory: frontend
        run: |
          pnpm lint
      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm run build

  deployment-config:
    runs-on: ubuntu-latest
    env:
      MEERO_API_KEY: ci-placeholder-key
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configurations
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.prod.yml config --quiet
          docker compose -f docker-compose.prod.yml -f docker-compose.voice.yml config --quiet

  docker-build-smoke:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: local
            dockerfile: Dockerfile
          - name: websafe
            dockerfile: Dockerfile.websafe
          - name: voice
            dockerfile: Dockerfile.voice
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.name }} backend image
        run: docker build --file "${{ matrix.dockerfile }}" --tag "meero-${{ matrix.name }}-ci" .
