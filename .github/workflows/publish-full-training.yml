name: Publish Model (Full Train)

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: 'Number of epochs to train'
        required: false
        default: '5'
      batch_size:
        description: 'Batch size'
        required: false
        default: '32'
      upload_hf:
        description: 'Upload artifacts to Hugging Face Hub'
        required: false
        default: 'true'
      upload_s3:
        description: 'Upload artifacts to S3'
        required: false
        default: 'false'
      dry_run:
        description: 'Perform a dry-run (validate credentials only)'
        required: false
        default: 'false'

jobs:
  full-train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}-py3.10
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Check HF secrets (when uploading to HF)
        if: ${{ inputs.upload_hf == 'true' }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_REPO" ]; then
            echo "HF_TOKEN or HF_REPO not set; aborting."; exit 1
          fi
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: ${{ secrets.HF_REPO }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install huggingface-hub
          pip install tensorflow==2.20.0 scikit-learn==1.7.2

      - name: Run full training and upload
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: ${{ secrets.HF_REPO }}
        run: |
          ARGS="--epochs ${{ inputs.epochs }} --batch ${{ inputs.batch_size }}"
          if [ "${{ inputs.upload_hf }}" = "true" ]; then ARGS="$ARGS --upload-hf"; fi
          if [ "${{ inputs.upload_s3 }}" = "true" ]; then ARGS="$ARGS --upload-s3"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          echo "Running: python scripts/train_and_package.py $ARGS"
          python scripts/train_and_package.py $ARGS
