[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100

[tool.pyrefly]
ignore-missing-imports = [
    "tensorflow.*",
    "keras.*",
    "tf_keras.*",
    "faster_whisper",
    "boto3",
]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "frontend/node_modules",
    "frontend/dist",
    "models",
    "data",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
]
ignore = [
    "E501",  # Line length
    "E402",  # Module import not at top of file
    "W293",  # Blank line contains whitespace
    "W292",  # No newline at end of file
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F841"]
"verify_changes.py" = ["F401"]
"scripts/*" = ["F401", "F841"]

